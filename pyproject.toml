[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "escape_room"
version = "0.1.0"
description = "Multi-agent cooperative puzzle environment powered by mjlab + mjwarp + rsl-rl"
requires-python = ">=3.10"
dependencies = [
    "mjlab>=1.6.0,<1.7",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
]

[project.scripts]
escape-room-train = "escape_room.train:main"
escape-room-play = "escape_room.play:main"

[tool.setuptools.packages.find]
include = ["escape_room*"]
